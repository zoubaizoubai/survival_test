name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Headless load check
        run: |
          godot --headless --path . --quit-after 2
          echo "headless load OK"

      - name: Run headless tests
        run: |
          godot --headless --path . -s res://tests/run_tests.gd -- seed=1337 isolated=true
          echo "tests PASS"

      - name: Check export presets
        run: |
          test -f export_presets.cfg || (echo "export_presets.cfg missing" && exit 1)
          grep -q 'name="Web"' export_presets.cfg || (echo "Web preset missing" && exit 1)
          grep -q 'platform="Web"' export_presets.cfg || (echo "Web platform missing" && exit 1)
          echo "export presets OK"

      - name: Export Web (release)
        run: |
          set -euo pipefail
          make export-web GODOT_FALLBACK=godot
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/version.txt

      - name: Export Linux (release)
        run: |
          set -euo pipefail
          make export-linux GODOT_FALLBACK=godot
          test -s build/linux/幸存者.x86_64
          test -s build/linux/version.txt

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: tests/baseline.json
          if-no-files-found: warn

      - name: Upload web build (if produced)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          if-no-files-found: error

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/
          if-no-files-found: error
